name: Daily Dashboard Data Sync & Deploy

on:
  schedule:
    # 1:00 PM IST (UTC+5:30) is 07:30 UTC every day
    - cron: '30 7 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "dashboard-sync"
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Live Google Sheet & Generate Dashboard Data
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL || vars.GOOGLE_SHEET_URL }}
        run: |
          if [ -z "$GOOGLE_SHEET_URL" ]; then
            echo "WARNING: GOOGLE_SHEET_URL is not set in GitHub Secrets or Variables."
            echo "Please add your Google Sheet URL as a Repository Secret named GOOGLE_SHEET_URL."
            exit 0
          fi
          python scripts/update_dashboard.py --source "$GOOGLE_SHEET_URL" --output data/latest_data.json

      - name: Commit & Push Updated Data to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_data.json
          
          if git diff --staged --quiet; then
            echo "No data changes detected from Google Sheet. Skipping commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(data): auto-update dashboard dataset [$TIMESTAMP]"
            git push origin main
            echo "Data successfully committed and pushed to main."
          fi
